<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="100%" stop-color="#ffa751"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff416c"/>
      <stop offset="100%" stop-color="#ff4b2b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="230" r="160" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="16 10" filter="url(#glow)"/>

  <!-- Golden central circle (Lottery ball) -->
  <circle cx="256" cy="230" r="130" fill="url(#goldGrad)"/>
  <circle cx="256" cy="230" r="115" fill="#0b132b"/>

  <!-- Lucky Four Leaf Clover / Star Symbol -->
  <path d="M 256,150 C 275,190 320,195 320,230 C 320,265 275,270 256,310 C 237,270 192,265 192,230 C 192,195 237,190 256,150 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="256" cy="230" r="28" fill="url(#redGrad)"/>

  <!-- Lucky Number "99" in center -->
  <text x="256" y="239" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle">99</text>

  <!-- Lao Branding Text -->
  <text x="256" y="420" font-family="'Outfit', 'Segoe UI', 'Noto Sans Lao', sans-serif" font-size="44" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">UniLotary</text>
  <text x="256" y="455" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#a0aec0" text-anchor="middle" letter-spacing="4">UNILOTARY LAO LOTTERY</text>
</svg>
